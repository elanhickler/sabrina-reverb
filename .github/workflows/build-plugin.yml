name: Build Plugin
on:
  push:
    branches:
      - main
      - rel_*
      - test/*
    tags:
      - 'v**'
  pull_request:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TARGET_NAME: sabrina-reverb-clap
  PLUGIN_NAME: Sabrina Reverb
  
defaults:
  run:
    shell: bash

jobs:
  build_plugin:
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            cmake_args: -Ax64

          - os: macos-latest
            name: macos
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -GNinja

          - os: ubuntu-latest
            name: linux-x64
            cmake_args: -GNinja

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare for JUCE
        uses: surge-synthesizer/sst-githubactions/prepare-for-juce@main
        with:
          os: ${{ runner.os }}

      # onc signing is set up
      #- uses: apple-actions/import-codesign-certs@v3
      #  if: runner.os == 'macOS' && github.event_name != 'pull_request'
      #  with:
      #    p12-file-base64: ${{ secrets.MAC_CERTS_P12 }}
      #    p12-password: ${{ secrets.CERT_PWD }}

      - name: Build release version
        if: github.event_name != 'pull_request'
        run: |
          cmake -S . -B ./build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=FALSE -DGITHUB_ACTIONS_BUILD=TRUE
          cmake --build ./build --config Release --target ${TARGET_NAME}_all --parallel 3

      - name: Configure pull request version
        if: github.event_name == 'pull_request'
        run: |
          cmake -S . -B ./build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Debug -DCOPY_AFTER_BUILD=FALSE  -DGITHUB_ACTIONS_BUILD=TRUE 

      - name: Build pull request version
        if: github.event_name == 'pull_request'
        run: |
          cmake --build ./build --config Debug --target ${TARGET_NAME}_all --parallel 3

      - name: Make windows zip
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        run: |
          mkdir -p build/inst
          
          cp LICENSE.md build/${TARGET_NAME}_assets
          cp resources/ReadmeZip.txt build/${TARGET_NAME}_assets
          pushd build/${TARGET_NAME}_assets
          ls -al

          7z a -r ../inst/Sabrina-Reverb-windows.zip *

      - name: Make Mac zip
        if: github.event_name != 'pull_request' && runner.os == 'macOS'
        run: |
          mkdir -p build/inst
          cp LICENSE.md build/${TARGET_NAME}_assets
          cp resources/ReadmeZip.txt build/${TARGET_NAME}_assets
          pushd build/${TARGET_NAME}_assets
          zip -r ../inst/Sabrina-Reverb-macos.zip .

      - name: Upload artifact
        if: github.event_name != 'pull_request' && runner.os != 'Linux'  # We get this through docker
        uses: actions/upload-artifact@v4
        with:
          path: build/inst
          name: dawplugin-${{ matrix.name }}


  build_plugin_docker:
    name: Build - Docker Ubuntu 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Docker
        uses: surge-synthesizer/sst-githubactions/cmake-in-docker@main
        with:
          image: ghcr.io/surge-synthesizer/sst-dockerimages/ubuntu20_gcc11:main
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          cmakeArgs: -DCMAKE_BUILD_TYPE=Release -GNinja  -DCOPY_AFTER_BUILD=FALSE  -DGITHUB_ACTIONS_BUILD=TRUE
          target: ${TARGET_NAME}_all


      - name: Make linux tgz
        run: |
          find build -name "${PLUGIN_NAME}*" -print

          mkdir -p build/inst
          cp LICENSE.md build/${TARGET_NAME}_assets
          cp resources/ReadmeZip.txt build/${TARGET_NAME}_assets
          pushd build/${TARGET_NAME}_assets
          ls -al

          tar cvzf ../inst/Sabrina-Reverb-linux.tgz .

      - name: Show Installer Directory
        run: |
          ls -l ./build/inst

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          path: build/inst
          name: build-docker-linux

  publish-plugin-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'soundemote'
    runs-on: ubuntu-latest
    needs: [build_plugin, build_plugin_docker]
    steps:
      - name: Upload to Release
        uses: surge-synthesizer/sst-githubactions/upload-to-release@main
        with:
          tag: ${{ github.ref_name }}
          reuse_tag: false
          create_tag: true
          token: ${{ secrets.GITHUB_TOKEN }}
